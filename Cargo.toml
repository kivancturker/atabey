[workspace]
resolver = "3"
# T-02 adds "apps/*/src-tauri", T-23 adds "extensions/*/backend".
# (Cargo treats a glob that matches nothing as a literal path, so add each glob when its first crate exists.)
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/kivancturker/atabey"
publish = false

# Versions chosen in specs/S0-foundations.md §5.1 (checked 2026-10-10).
# Crates opt in with `foo.workspace = true`; add here first, never in a member crate.
[workspace.dependencies]
tauri = "2.12"
tauri-build = "2.12"
tauri-specta = "=2.0.0-rc.25"    # T-03 adds specta + specta-typescript at the exact versions this RC requires
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
jsonschema = "0.58"
comrak = "0.56"
serde-saphyr = "1.3"
toml = "1.1"
gix = { version = "0.89", default-features = false }
notify = "8.2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.28", features = ["v7", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
insta = "1.49"
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
