[workspace]
resolver = "3"
# T-23 adds "extensions/*/backend".
# (Cargo treats a glob that matches nothing as a literal path, so add each glob when its first crate exists.)
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/kivancturker/atabey"
publish = false

# Versions chosen in specs/S0-foundations.md §5.1 (checked 2026-10-10).
# Crates opt in with `foo.workspace = true`; add here first, never in a member crate.
[workspace.dependencies]
# Workspace crates (the version keeps cargo-deny from treating path deps as wildcards).
atabey-defter = { path = "crates/atabey-defter", version = "0.1.0" }
atabey-types = { path = "crates/atabey-types", version = "0.1.0" }

tauri = "2.12"
tauri-build = "2.7"   # versioned independently of tauri (latest 2.7.2, crates.io 2026-10-11)
# Typed IPC (ADR-0002, ADR-0009). Exact pins: these RCs must move together (tauri-specta rc.25 requires specta =rc.25, specta-typescript 0.0.12).
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "uuid", "rust_decimal"] }
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"   # serde-attribute-aware format for specta exports (used by atabey-defter tests)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["uuid1", "rust_decimal1"] }
jsonschema = "0.58"
comrak = "0.56"
serde-saphyr = "1.3"
toml = "1.1"
gix = { version = "0.89", default-features = false }
notify = "8.2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.28", features = ["v7", "serde"] }
rust_decimal = "1.43"           # money is never f64; serializes as a string
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde-well-known"] }  # ADR-0010: Defter timestamps and day folders
tempfile = "3.27"                # test fixtures (temp dirs)
anyhow = "1.0"
insta = "1.49"
proptest = "1.11"               # pinned to 1.11.0 in Cargo.lock (1.12.0 is under two weeks old, ADR-0011)
aho-corasick = "1.1"             # ADR-0011: known-secret matcher (spec §5.8)
regex = "1.13"                   # ADR-0011: redaction pattern rules (linear time)
percent-encoding = "2.3"         # ADR-0011: dev-dependency only, tests encode secrets with it

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
