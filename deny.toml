# License and dependency policy: CONSTITUTION.md Article 10 (v1.1.0), checked by `mise run deny` and CI.

[graph]
all-features = true

[advisories]
# RustSec advisories: vulnerable crates fail the check. Add ignores only with a linked ADR.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained; Tauri Linux GTK3 build-time macro only (ADR-0008)
]

[licenses]
confidence-threshold = 0.93
# The allow-list is the Constitution's policy, not today's dependency set; unused entries are fine.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",            # Boost Software License (allowed). BUSL (Business Source License) is NOT.
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
